<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>小霸王 · 超级玛丽</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            background: #0e0e12;
            background-image: radial-gradient(ellipse 90% 70% at 50% 30%, rgba(255, 176, 88, .05), transparent 60%);
            color: #c9c9cf;
            font-family: "Press Start 2P", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
            padding: 22px 10px 34px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .page-head {
            font-size: 11px;
            letter-spacing: 2px;
            color: #8f8f98;
            margin-bottom: 14px;
            text-align: center
        }

        .page-head b {
            color: #e8e8ee;
            font-weight: normal
        }

        .console {
            width: min(94vw, 740px);
            background: linear-gradient(#33333a, #28282e 60%, #222228);
            border: 1px solid #3d3d45;
            border-radius: 26px;
            padding: 20px 20px 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .07);
        }

        .bezel {
            position: relative;
            background: #111114;
            border-radius: 16px;
            padding: 16px;
            box-shadow: inset 0 3px 14px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 255, 255, .05);
        }

        canvas#game {
            display: block;
            width: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #5c94fc;
            border-radius: 6px
        }

        .scan {
            position: absolute;
            inset: 16px;
            border-radius: 6px;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .18) 3px 4px);
        }

        .vig {
            position: absolute;
            inset: 16px;
            border-radius: 6px;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, .32) 100%);
        }

        .bezel-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 0 4px
        }

        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a1512;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6);
            transition: .4s
        }

        .led.on {
            background: #ff5040;
            box-shadow: 0 0 7px rgba(255, 80, 64, .8)
        }

        .bezel-brand {
            font-size: 8px;
            color: #6b6b74;
            letter-spacing: 3px
        }

        .bezel-brand span {
            color: #9a9aa4
        }

        .panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px 8px 4px
        }

        .dpad {
            position: relative;
            width: 118px;
            height: 118px;
            flex: none
        }

        .dpad button {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #1b1b20;
            border: 1px solid #0c0c0f;
            border-radius: 8px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, .06), 0 4px 0 #0a0a0d;
            cursor: pointer;
        }

        .dpad button:active,
        .dpad button.hold {
            transform: translateY(3px);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, .04), 0 1px 0 #0a0a0d
        }

        .dp-u {
            left: 39px;
            top: 0
        }

        .dp-d {
            left: 39px;
            top: 78px
        }

        .dp-l {
            left: 0;
            top: 39px
        }

        .dp-r {
            left: 78px;
            top: 39px
        }

        .dp-c {
            left: 39px;
            top: 39px;
            background: #1b1b20 !important;
            border-radius: 0;
            box-shadow: none !important;
            border: none;
            pointer-events: none
        }

        .tri {
            display: block;
            margin: auto;
            width: 0;
            height: 0;
            border: 7px solid transparent
        }

        .dp-u .tri {
            border-bottom-color: #585863;
            border-top: none;
            margin-top: 8px
        }

        .dp-d .tri {
            border-top-color: #585863;
            border-bottom: none;
            margin-bottom: 8px
        }

        .dp-l .tri {
            border-right-color: #585863;
            border-left: none;
            margin-left: 8px
        }

        .dp-r .tri {
            border-left-color: #585863;
            border-right: none;
            margin-right: 8px
        }

        .mid {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 0
        }

        .nameplate {
            font-size: 9px;
            color: #b9b9c2;
            letter-spacing: 4px;
            text-align: center;
            white-space: nowrap
        }

        .nameplate small {
            display: block;
            font-size: 7px;
            color: #71717b;
            letter-spacing: 2px;
            margin-top: 6px
        }

        .pills {
            display: flex;
            gap: 16px
        }

        .pills button {
            font-family: inherit;
            font-size: 7px;
            color: #9a9aa4;
            letter-spacing: 1px;
            background: #232329;
            border: 1px solid #0d0d10;
            border-radius: 10px;
            padding: 7px 12px 6px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 3px 0 #0a0a0d;
        }

        .pills button:active {
            transform: translateY(2px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 1px 0 #0a0a0d
        }

        .ab {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex: none;
            padding-bottom: 6px
        }

        .ab .btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #5e130e;
            cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #e05243, #c02c22 70%);
            box-shadow: inset 0 2px 2px rgba(255, 255, 255, .28), 0 5px 0 #6e120d, 0 8px 12px rgba(0, 0, 0, .4);
            color: #ffe3dd;
            font-family: inherit;
            font-size: 13px;
        }

        .ab .btn:active,
        .ab .btn.hold {
            transform: translateY(4px);
            box-shadow: inset 0 2px 2px rgba(255, 255, 255, .15), 0 1px 0 #6e120d
        }

        .ab .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px
        }

        .ab .wrap em {
            font-style: normal;
            font-size: 7px;
            color: #7c7c86;
            letter-spacing: 2px
        }

        .help {
            margin-top: 18px;
            font-size: 9px;
            color: #84848d;
            line-height: 2.4;
            text-align: center;
            font-family: "Microsoft YaHei", sans-serif
        }

        kbd {
            font-family: "Press Start 2P", monospace;
            font-size: 8px;
            color: #d6d6dc;
            background: #1e1e25;
            border: 1px solid #35353f;
            border-bottom: 3px solid #0d0d11;
            border-radius: 5px;
            padding: 4px 7px;
            margin: 0 2px;
        }

        @media (pointer:coarse) {
            .dpad {
                width: 132px;
                height: 132px
            }

            .dpad button {
                width: 44px;
                height: 44px
            }

            .dp-u {
                left: 44px
            }

            .dp-d {
                left: 44px;
                top: 88px
            }

            .dp-l {
                top: 44px
            }

            .dp-r {
                left: 88px;
                top: 44px
            }

            .dp-c {
                left: 44px;
                top: 44px
            }

            .ab .btn {
                width: 64px;
                height: 64px
            }
        }

        @media (max-width:560px) {
            .console {
                padding: 12px 12px 10px
            }

            .bezel {
                padding: 10px
            }

            .panel {
                padding: 14px 2px 2px
            }

            .nameplate small {
                display: none
            }
        }
    </style>
</head>

<body>
    <div class="page-head">小霸王 · <b>SUPER MARIO</b> · 像素复刻</div>

    <div class="console">
        <div class="bezel">
            <canvas id="game" width="512" height="480"></canvas>
            <div class="scan"></div>
            <div class="vig"></div>
            <div class="bezel-bottom">
                <div class="led" id="led"></div>
                <div class="bezel-brand">SUBOR <span>· TV-GAME 260 ·</span> PIXEL DISPLAY</div>
            </div>
        </div>
        <div class="panel">
            <div class="dpad" id="dpad">
                <button class="dp-u" data-k="up"><i class="tri"></i></button>
                <button class="dp-l" data-k="left"><i class="tri"></i></button>
                <button class="dp-c"></button>
                <button class="dp-r" data-k="right"><i class="tri"></i></button>
                <button class="dp-d" data-k="down"><i class="tri"></i></button>
            </div>
            <div class="mid">
                <div class="nameplate">小霸王 · 其乐无穷<small>SUBOR STUDENT COMPUTER</small></div>
                <div class="pills">
                    <button id="btnSelect">SELECT·音乐</button>
                    <button id="btnStart">START</button>
                </div>
            </div>
            <div class="ab">
                <div class="wrap"><button class="btn" data-k="run">B</button><em>RUN</em></div>
                <div class="wrap"><button class="btn" data-k="jump">A</button><em>JUMP</em></div>
            </div>
        </div>
    </div>

    <div class="help">
        <kbd>←</kbd><kbd>→</kbd> 移动　<kbd>Z</kbd>/<kbd>K</kbd>/<kbd>空格</kbd>
        跳跃　<kbd>X</kbd>/<kbd>J</kbd>/<kbd>Shift</kbd> 加速跑<br>
        <kbd>Enter</kbd> 开始 / 暂停　<kbd>M</kbd> 音乐开关　·　触屏可直接使用下方按键
    </div>

    <script>
        (() => {
            'use strict';
            /* ================= 基础 ================= */
            const cv = document.getElementById('game'), ctx = cv.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            const SC = 2, TILE = 16, VW = 256, VH = 240;
            const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
            const $ = id => document.getElementById(id);

            /* ================= 调色板 & 精灵 ================= */
            const PAL = {
                R: '#d93a20', S: '#ffb673', B: '#2b53cf', N: '#7a4520', K: '#181010', W: '#ffffff', Y: '#ffd23e',
                D: '#6e3812', L: '#c9803e', F: '#ffe8c8', C: '#ffd23e', c: '#d97e00'
            };
            function makeSprite(rows) {
                const w = Math.max(...rows.map(r => r.length)), h = rows.length;
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                const g = c.getContext('2d');
                rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const col = PAL[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
                return c;
            }
            function flipH(c) {
                const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
                const g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f;
            }

            /* --- 小马里奥 12x16（默认朝右） --- */
            const headS = [
                '....RRRRR...', '...RRRRRRRRR', '...NNNSSKS..', '..NSNSSSKSS.', '..NSNNSSSSS.', '..NNSSSSNNN.', '....SSSSSSS.'];
            const mIdle = makeSprite([...headS,
                '...RRBBBRR..', '..RRRBBBRRR.', '.RRRBBBBRRR.', '.SSBBYBBYBSS', '.SSBBBBBBBSS', '...BBBBBBB..',
                '..BBB..BBB..', '..NNNN.NNNN.', '..NNNN.NNNN.']);
            const mW1 = makeSprite([...headS,
                '...RRBBBRR..', '..RRRBBBRRR.', '.SSRBBBBRR..', '.SSBBYBBB...', '...BBBBBB...', '..BBBB.BBB..',
                '.NNNN..BBB..', 'NNNNN...NNN.', 'NNN......NN.']);
            const mW2 = makeSprite([...headS,
                '...RRBBBRR..', '..RRRBBBRRR.', '.RRRBBBBRRR.', '.SSBBYBBYBSS', '.SSBBBBBBBSS', '...BBBBBBB..',
                '...NNNNNN...', '..NNNNNN....', '..NNNN......']);
            const mJump = makeSprite([...headS,
                'SS..SSSSSSS.', 'SSRRBBBBRRS.', 'SRRRRBBBBRR.', '.RRRBBBBBBR.', '..RBBYBBYB..', '..BBBBBBBB..',
                '.NNBBBBBBB..', '.NNNN.BBBB..', '.NNN..NNNN..', '......NNNN..']);
            const mDie = makeSprite([
                'S....RRRRR.S', 'S...RRRRRRRS', 'S..NNNSSKS.S', 'S.NSNSSSKSS.', '..NSNNSSSSS.', '..NNSSSSNNN.',
                '....SSSSSSS.', '..RRRBBBRRR.', '.RRRBBBBRRR.', '.RRRBBBBRRR.', '.RBBBBBBBBR.', '...BBBBBBB..',
                '..BBB..BBB..', '..NNN..NNN..', '.NNNN..NNNN.', '............']);
            /* --- 大马里奥 12x24 --- */
            const headB = [
                '....RRRRR...', '...RRRRRRRRR', '...RRRRRRRRR', '...NNNSSKS..', '..NSNSSSKSS.', '..NSNNSSSSS.',
                '..NSNNSSSSS.', '..NNSSSSNNN.', '....SSSSSSS.'];
            const bodyB = [
                '...RRRRRRR..', '..RRRRRRRRR.', '.RRRBBBBRRR.', '.RRBBBBBBRR.', '.SSBBYBBYBSS', '.SSBBBBBBBSS',
                '.SSBBBBBBBSS', '..SBBBBBBBS.', '...BBBBBBB..', '...BBBBBBB..'];
            const bIdle = makeSprite([...headB, ...bodyB,
                '..BBBB.BBB..', '..BBB..BBB..', '..NNNN.NNN..', '.NNNNN.NNNN.', '.NNNNN.NNNN.']);
            const bW1 = makeSprite([...headB, ...bodyB,
                '..BBBB.BBB..', '.BBBB...BBB.', '.NNNN....BBB', 'NNNNN.....NN', 'NNNN.......N']);
            const bW2 = makeSprite([...headB, ...bodyB,
                '..BBBBBBB...', '...BBBBBB...', '...NNNNN....', '..NNNNNN....', '..NNNNN.....']);
            const bJump = makeSprite([...headB,
                'S..RRRRRRR..', 'S.RRRRRRRRR.', 'SRRRBBBBRRR.', '.RRBBBBBBRR.', '.RRBBYBBYB..', '.SBBBBBBBBR.',
                '.SBBBBBBBB..', '..BBBBBBBB..', '.NNBBBBBBB..', '.NNNN.BBBB..', '.NNN...BBBB.', '.NNN..NNNN..',
                '......NNNN..', '.....NNNNN..', '............']);
            /* --- 栗子怪 --- */
            const gW1 = makeSprite([
                '......DDDD......', '....DDLLLLDD....', '...DDLLLLLLDD...', '..DDDDLLLLDDDD..',
                '..DLDDWWWWDDLD..', '.DDLWWKWWKWWLDD.', '.DLLWWWWWWWWLDD.', 'DLLLLWWWWWWLLLLD',
                'DLLLLLWWWWLLLLLD', 'DLLLLLLLLLLLLLLD', 'DLLLLLLLLLLLLLLD', '.DDLLLLLLLLLLDD.',
                '..DDLLLLLLLLDD..', '..KKKK....KKKK..', '.KKKKK....KKKKK.', '................']);
            const gW2 = makeSprite([
                '......DDDD......', '....DDLLLLDD....', '...DDLLLLLLDD...', '..DDDDLLLLDDDD..',
                '..DLDDWWWWDDLD..', '.DDLWWKWWKWWLDD.', '.DLLWWWWWWWWLDD.', 'DLLLLWWWWWWLLLLD',
                'DLLLLLWWWWLLLLLD', 'DLLLLLLLLLLLLLLD', 'DLLLLLLLLLLLLLLD', '.DDLLLLLLLLLLDD.',
                '..DDLLLLLLLLDD..', '..KKKKK...KKK...', '.KKKKKK....KKK..', '................']);
            const gFlat = makeSprite([
                '................', '................', '................', '................',
                '................', '................', '................', '................',
                '...DDLLLLLLDD...', '.DDLLWWWWWWLLDD.', 'DLLLLKWWWWKLLLLD', 'DKKKKKKKKKKKKKKD',
                '.KKK........KKK.', '................', '................', '................']);
            /* --- 蘑菇 --- */
            const mush = makeSprite([
                '.....RRRRRR.....', '...RRWWWWWWRR...', '..RRRWWWWWWRRR..', '..RRRRWWWWRRRR..',
                '.RRRRRRWWRRRRRR.', '.RWWRRRRRRRRWWR.', '.RWWWRRRRRRWWWR.', 'RWWWWRRRRRRWWWWR',
                'RWWWWRRRRRRWWWWR', 'RRWWRRRRRRRRWWRR', '.RRFFFFFFFFFRR..', '..FFFKFFFFKFFF..',
                '..FFFKFFFFKFFF..', '..FFFFFFFFFFFF..', '...FFFFFFFFFF...', '....FFFFFFFF....']);
            /* --- 金币 --- */
            const coinF = [
                makeSprite(['...cccc...', '..cCCCCc..', '.cCWCCCCc.', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', 'cCWCCcCCCc', '.cCCCCCCc.', '..cCCCCc..', '...cccc...']),
                makeSprite(['..........', '..........', '....cc....', '...cCCc...', '...cWCc...', '...cCCc...', '...cCCc...', '...cCCc...', '...cCCc...', '...cCCc...', '...cCCc...', '...cCCc...', '...cCCc...', '....cc....']),
                makeSprite(['..........', '..........', '....cc....', '....cc....', '....cC....', '....cC....', '....cC....', '....cC....', '....cC....', '....cC....', '....cC....', '....cC....', '....cc....', '....cc....'])];
            const coinSeq = [0, 1, 2, 1];
            const hudCoin = makeSprite(['..cccc..', '.cCCCCc.', 'cCWCCcCc', 'cCWCCcCc', 'cCWCCcCc', 'cCWCCcCc', '.cCCCCc.', '..cccc..']);
            /* --- 马里奥帧表：[朝左, 朝右] --- */
            const MAR = {
                small: { idle: [flipH(mIdle), mIdle], w1: [flipH(mW1), mW1], w2: [flipH(mW2), mW2], jump: [flipH(mJump), mJump], die: [mDie, mDie] },
                big: { idle: [flipH(bIdle), bIdle], w1: [flipH(bW1), bW1], w2: [flipH(bW2), bW2], jump: [flipH(bJump), bJump] }
            };

            /* ================= 程序化 Tile ================= */
            const O = { hi: '#f8a45c', mid: '#c85c1c', dk: '#241206', blk: '#0d0603' };
            function tileC(fn) { const c = document.createElement('canvas'); c.width = 16; c.height = 16; fn(c.getContext('2d')); return c; }
            const tGround = tileC(g => {
                g.fillStyle = O.mid; g.fillRect(0, 0, 16, 16);
                g.fillStyle = O.hi; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
                g.fillStyle = O.dk; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
                g.fillRect(7, 2, 1, 6); g.fillRect(2, 8, 1, 6); g.fillRect(11, 9, 1, 5);
                g.fillStyle = O.hi; g.fillRect(3, 3, 2, 1); g.fillRect(9, 10, 2, 1);
            });
            const tBrick = tileC(g => {
                g.fillStyle = O.mid; g.fillRect(0, 0, 16, 16);
                g.fillStyle = O.hi; g.fillRect(0, 0, 16, 1);
                g.fillStyle = O.dk; g.fillRect(0, 7, 16, 1); g.fillRect(0, 15, 16, 1);
                g.fillRect(11, 1, 1, 6); g.fillRect(3, 8, 1, 7);
            });
            const tHard = tileC(g => {
                g.fillStyle = O.mid; g.fillRect(0, 0, 16, 16);
                g.fillStyle = O.hi; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
                g.fillStyle = O.dk; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
                g.fillStyle = O.blk; g.fillRect(1, 1, 1, 1); g.fillRect(14, 1, 1, 1); g.fillRect(1, 14, 1, 1); g.fillRect(14, 14, 1, 1);
                g.fillStyle = O.hi; g.fillRect(3, 3, 3, 3);
            });
            function qTile(base) {
                return tileC(g => {
                    g.fillStyle = base; g.fillRect(0, 0, 16, 16);
                    g.fillStyle = '#ffe9a0'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
                    g.fillStyle = '#7a3b00'; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
                    g.fillStyle = '#181010'; g.fillRect(1, 1, 1, 1); g.fillRect(14, 1, 1, 1); g.fillRect(1, 14, 1, 1); g.fillRect(14, 14, 1, 1);
                    const q = ['.###.', '##.##', '..##.', '..#..', '.....', '..#..'];
                    q.forEach((r, y) => { for (let x = 0; x < 5; x++)if (r[x] === '#') { g.fillStyle = '#7a3b00'; g.fillRect(x + 7, y + 8, 1, 1); g.fillStyle = '#fff'; g.fillRect(x + 6, y + 7, 1, 1); } });
                });
            }
            const tQ = [qTile('#f8b820'), qTile('#e09010'), qTile('#c87800')];
            const tUsed = tileC(g => {
                g.fillStyle = '#8a5a20'; g.fillRect(0, 0, 16, 16);
                g.fillStyle = '#a8742f'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
                g.fillStyle = '#3d2405'; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
                g.fillStyle = '#181010'; g.fillRect(1, 1, 1, 1); g.fillRect(14, 1, 1, 1); g.fillRect(1, 14, 1, 1); g.fillRect(14, 14, 1, 1);
            });
            const PG = { l: '#9ce04c', m: '#38b028', d: '#0f6e14', k: '#0a3a0a' };

                for (let r = Math.floor(p.y / 16); r <= Math.floor((p.y + p.h) / 16); r++)
                    for (let c = Math.floor(p.x / 16); c <= Math.floor((p.x + p.w) / 16); c++)
                        if (tileAt(c, r) === 12) { setTile(c, r, 0); coins++; addScore(200); SFX.coin(); addFloat(c * 16, r * 16 - 10, '200'); }
                if (p.y > VH + 24) killPlayer(true);
                if (p.x + p.w >= LV.flagX * 16 - 2 && state === 'playing') {
                    setState('flag'); p.x = LV.flagX * 16 - 5; p.vx = 0; p.vy = 0;
                    SFX.flag(); bgmStop();
                    const grabY = p.y;
                    const bonus = grabY < 70 ? 5000 : grabY < 110 ? 2000 : grabY < 150 ? 800 : grabY < 185 ? 400 : 100;
                    addScore(bonus); addFloat(LV.flagX * 16 - 24, grabY - 10, '' + bonus);
                }
            }
            function killPlayer(fell) {
                if (state !== 'playing') return;
                setState('dying'); player.vy = fell ? 2 : -7.5; player.dead = true;
                bgmStop(); SFX.die();
            }
            function hurtPlayer() {
                const p = player;
                if (p.inv > 0 || p.freeze > 0) return;
                if (p.size > 0) {
                    p.size = 0; p.h = 14; p.y += 8; p.inv = 120; p.freeze = 40; SFX.hurt();
                } else killPlayer(false);
            }
            function growPlayer() {
                const p = player;
                if (p.size === 0) { p.size = 1; p.h = 22; p.y -= 8; p.freeze = 45; SFX.grow(); }
                addScore(1000); addFloat(p.x, p.y - 10, '1000');
            }
            function updateGoombas() {
                goombas.forEach(g => {
                    if (g.flip) { g.vy += .4; g.x += g.vx; g.y += g.vy; return; }
                    if (g.dead) { g.dead++; return; }
                    if (!g.active) { if (g.x < cam.x + VW + 24) g.active = true; else return; }
                    g.vx = g.vx || -.42;
                    const dir = g.vx < 0 ? -1 : 1;
                    g.vy += .45; if (g.vy > MAXFALL) g.vy = MAXFALL;
                    rectSolid(g, null);
                    if (g.hitWall) g.vx = -dir * .42;
                    if (g.y > VH + 24) g.dead = 99;
                });
                for (let i = 0; i < goombas.length; i++)for (let j = i + 1; j < goombas.length; j++) {
                    const a = goombas[i], b = goombas[j];
                    if (a.active && b.active && !a.dead && !b.dead && !a.flip && !b.flip && overlap(a, b)) {
                        a.vx = -Math.abs(a.vx) || -.42; b.vx = Math.abs(b.vx) || .42;
                        if (a.x < b.x) a.x = b.x - a.w - .1; else b.x = a.x - b.w - .1;
                    }
                }
                goombas = goombas.filter(g => !(g.dead > 30) && g.y < VH + 40);
            }
            function updateMushrooms() {
                mushrooms.forEach(m => {
                    if (m.rise > 0) { m.y -= .5; m.rise -= .5; if (m.rise <= 0) { m.vx = .65; m.y = Math.round(m.y); } return; }
                    const dir = m.vx < 0 ? -1 : 1;
                    m.vy += .45; if (m.vy > MAXFALL) m.vy = MAXFALL;
                    rectSolid(m, null);
                    if (m.hitWall) m.vx = -dir * .65;
                    if (m.y > VH + 24) m.gone = true;
                });
                mushrooms = mushrooms.filter(m => !m.gone);
            }
            function updateInteractions() {
                const p = player;
                goombas.forEach(g => {
                    if (!g.active || g.dead || g.flip) return;
                    if (overlap(p, g)) {
                        if (p.vy > .5 && p.y + p.h - g.y < 9) {
                            const chain = [100, 200, 400, 800, 1000, 2000, 4000, 8000][Math.min(p.stompChain, 7)];
                            g.dead = 1; addScore(chain); addFloat(g.x, g.y - 10, '' + chain);
                            p.stompChain++; p.vy = keys.jump ? -6.6 : -4.2; SFX.stomp();
                        } else hurtPlayer();
                    }
                });
                mushrooms.forEach(m => { if (m.rise <= 0 && overlap(p, m)) { m.gone = true; growPlayer(); } });
            }
            function updateFx() {
                popCoins.forEach(c => { c.t++; c.vy += .35; c.y += c.vy; });
                popCoins = popCoins.filter(c => c.t < 32);
                particles.forEach(p => { p.life--; p.vy += p.g; p.x += p.vx; p.y += p.vy; });
                particles = particles.filter(p => p.life > 0);
                floats.forEach(f => { f.life--; f.y -= .6; });
                floats = floats.filter(f => f.life > 0);
                fireworks.forEach(p => { p.life--; p.vy += .05; p.x += p.vx; p.y += p.vy; });
                fireworks = fireworks.filter(p => p.life > 0);
                bumps.forEach((v, k) => { v--; if (v <= 0) bumps.delete(k); else bumps.set(k, v); });
            }
            function updateCamera() {
                cam.x = clamp(Math.max(cam.x, player.x - 96), 0, LW * 16 - VW);
            }
            function updateWorld() {
                if (++timeAcc >= 24) {
                    timeAcc = 0; timeLeft--;
                    if (timeLeft === 100 && !hurry) { hurry = true; bgmRate = 1.3;[0, .1, .2].forEach(t => tone({ f: 1319, t, dur: .06, vol: .06 })); }
                    if (timeLeft <= 0) killPlayer(false);
                }
                updatePlayer();
                if (state !== 'playing') return;
                updateGoombas(); updateMushrooms(); updateInteractions(); updateFx(); updateCamera();
            }
            /* 旗杆三阶段：滑到底座顶 → 跳到杆右侧 → 落地走进城堡 */
            function updateFlag() {
                const p = player;
                if (flagPhase === 0) {
                    const standY = 192 - p.h;
                    let done = true;
                    if (p.y < standY) { p.y = Math.min(p.y + 2.4, standY); done = false; }
                    else if (p.y > standY) { p.y = Math.max(p.y - 2.4, standY); done = false; }
                    if (flagY < 180) { flagY = Math.min(flagY + 2.6, 180); done = false; }
                    if (done) flagPhase = 1;
                } else if (flagPhase === 1) {
                    if (++stateT > 30) { flagPhase = 2; p.dir = 1; p.x = LV.flagX * 16 + 6; p.vx = 0; p.vy = -2.4; }
                } else {
                    p.vy += G_FALL; if (p.vy > MAXFALL) p.vy = MAXFALL;
                    rectSolid(p, null);
                    if (p.grounded) { setState('walkoff'); SFX.clear(); }
                }
                updateFx();
            }
            function updateWalkoff() {
                const p = player;
                p.vx = 1.1; p.vy += G_FALL; if (p.vy > MAXFALL) p.vy = MAXFALL;
                rectSolid(p, null);
                p.walkT += .12;
                if (p.x > LV.doorX * 16) { p.hidden = true; setState('bonus'); fwTimer = 30; bonusDone = false; clearT = 0; }
                updateFx();
            }
            function updateBonus() {
                if (fwTimer > 0 && ++stateT >= fwTimer && fireworks.length < 200) {
                    stateT = 0; fwTimer += 45;
                    if (fwTimer <= 170) {
                        SFX.fire();
                        const cx = LV.castleX * 16 + 40 + (Math.random() * 60 - 30), cy = 60 + Math.random() * 30;
                        const cols = ['#ff5040', '#ffd23e', '#ffffff', '#9ce04c', '#6fa8ff'];
                        for (let i = 0; i < 26; i++) {
                            const a = i / 26 * Math.PI * 2, sp = 1 + Math.random() * .9;
                            fireworks.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 40 + Math.random() * 18, col: cols[i % 5] });
                        }
                    }
                }
                if (timeLeft > 0) {
                    const step = Math.min(timeLeft, 2);
                    timeLeft -= step; addScore(step * 10);
                    if (frame % 4 === 0) SFX.tick();
                } else if (!bonusDone) { bonusDone = true; clearT = 0; }
                if (bonusDone) clearT++;
                if (bonusDone && clearT > 420) toTitle(); /* 修复点：结算屏 7 秒无操作自动回标题 */
                updateFx();
            }
            function updateDying() {
                const p = player;
                if (stateT > 20) { p.vy += .4; p.y += p.vy; }
                updateFx();
                if (stateT > 150) {
                    lives--;
                    if (lives > 0) { setState('interlude'); }
                    else {
                        setState('gameover');
                        if (score > topScore) { topScore = score; try { localStorage.setItem('subor_mario_top', topScore); } catch (e) { } }
                    }
                }
            }
            function update() {
                frame++; animT++;
                switch (state) {
                    case 'boot': if (++stateT > 100) toTitle(); break;
                    case 'title': break;
                    case 'interlude': if (++stateT > 110) startPlay(); break;
                    case 'playing': if (!paused) updateWorld(); break;
                    case 'dying': updateDying(); break;
                    case 'flag': updateFlag(); break;
                    case 'walkoff': updateWalkoff(); break;
                    case 'bonus': updateBonus(); break;
                    case 'gameover': if (++stateT > 600) toTitle(); break;
                }
            }

            /* ================= 渲染 ================= */
            const F8 = '8px "Press Start 2P",monospace';
            const F10 = '10px "Press Start 2P","Microsoft YaHei",sans-serif';
            const F16 = '16px "Press Start 2P","Microsoft YaHei",sans-serif';
            function text(s, x, y, col = '#fff', font = F8, shadow = true) {
                ctx.font = font; ctx.textBaseline = 'top';
                if (shadow) { ctx.fillStyle = '#181010'; ctx.fillText(s, x + 1, y + 1); }
                ctx.fillStyle = col; ctx.fillText(s, x, y);
            }
            function textC(s, cx, y, col, font) { ctx.font = font; ctx.textAlign = 'center'; text(s, cx - ctx.measureText(s).width / 2, y, col, font); ctx.textAlign = 'left'; }

            function drawWorldBG() {
                ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, VW, VH);
                const cx = cam.x;
                deco.forEach(d => {
                    if (d.t === 'cloud') { ctx.drawImage(cloudImg, Math.round(d.x - cx * .9), d.y); }
                    else if (d.t === 'hillB') { if (d.x - cx > -90 && d.x - cx < VW) ctx.drawImage(hillBig, Math.round(d.x - cx), 208 - 36); }
                    else if (d.t === 'hillS') { if (d.x - cx > -60 && d.x - cx < VW) ctx.drawImage(hillSmall, Math.round(d.x - cx), 208 - 20); }
                    else if (d.t === 'bush') { if (d.x - cx > -50 && d.x - cx < VW) ctx.drawImage(bushImg, Math.round(d.x - cx), 208 - 22); }
                });
                ctx.drawImage(castleImg, Math.round(LV.castleX * 16 - cx), 208 - 80);
                const fx = Math.round(LV.flagX * 16 - cx) + 7;
                ctx.fillStyle = '#b8e890'; ctx.fillRect(fx, 40, 2, 168);
                ctx.fillStyle = '#38b028'; pxCircle(ctx, fx + 1, 38, 4);
                ctx.fillStyle = '#2ca828';
                ctx.fillRect(fx - 13, Math.round(flagY), 13, 3); ctx.fillRect(fx - 10, Math.round(flagY) + 3, 10, 3); ctx.fillRect(fx - 6, Math.round(flagY) + 6, 6, 3);
            }
            function drawTiles() {
                if (!map) return; /* 修复点：关卡数据未就绪时不绘制，防止崩溃 */
                const c0 = Math.max(0, Math.floor(cam.x / 16)), c1 = Math.min(LW - 1, c0 + 17);
                const qf = coinSeq[Math.floor(animT / 8) % 4], cf = coinSeq[Math.floor(animT / 7) % 4];
                for (let r = 0; r < LH; r++)for (let c = c0; c <= c1; c++) {
                    const t = map[r * LW + c]; if (!t) continue;
                    const key = c + ',' + r, bp = bumps.get(key);
                    const yo = bp ? -Math.sin((10 - bp) / 10 * Math.PI) * 5 : 0;
                    const x = c * 16 - Math.round(cam.x), y = r * 16 + yo;
                    switch (t) {
                        case 1: ctx.drawImage(tGround, x, y); break;
                        case 2: ctx.drawImage(tBrick, x, y); break;
                        case 3: ctx.drawImage(tQ[qf], x, y); break;
                        case 4: ctx.drawImage(tHard, x, y); break;
                        case 5: ctx.drawImage(tPipeTL, x, y); break;
                        case 6: ctx.drawImage(tPipeTR, x, y); break;
                        case 7: ctx.drawImage(tPipeBL, x, y); break;
                        case 8: ctx.drawImage(tPipeBR, x, y); break;
                        case 9: ctx.drawImage(tUsed, x, y); break;
                        case 12: ctx.drawImage(coinF[cf], x + 3, y + 1); break;
                    }
                }
            }
            function drawPlayer() {
                const p = player;
                if (!p || p.hidden) return;
                if (p.inv > 0 && frame % 4 < 2 && state === 'playing') return;
                const set = p.size > 0 ? MAR.big : MAR.small;
                let spr;
                if (p.dead) spr = MAR.small.die[0];
                else if (!p.grounded && state !== 'flag') spr = set.jump[p.dir];
                else if (state === 'flag') spr = set.jump[1];
                else if (Math.abs(p.vx) > .2 || state === 'walkoff') { spr = (Math.floor(p.walkT) % 2 ? set.w1 : set.w2)[p.dir]; }
                else spr = set.idle[p.dir];
                if (p.freeze > 0) {
                    if (frame % 6 < 3) spr = (p.size > 0 ? MAR.small.idle : MAR.big.idle)[p.dir];
                }
                const dy = p.size > 0 ? p.h - 24 + 2 : p.h - 16 + 2;
                ctx.drawImage(spr, Math.round(p.x - cam.x), Math.round(p.y) + dy);
            }
            function drawEntities() {
                const gf = Math.floor(animT / 12) % 2 ? gW1 : gW2;
                goombas.forEach(g => {
                    if (g.dead > 0) { ctx.drawImage(gFlat, Math.round(g.x - 1 - cam.x), Math.round(g.y) + 6); return; }
                    if (g.flip) {
                        ctx.save(); ctx.translate(Math.round(g.x - 1 - cam.x) + 8, Math.round(g.y) + 8);
                        ctx.scale(1, -1); ctx.drawImage(gf, -8, -8); ctx.restore();
                    } else ctx.drawImage(gf, Math.round(g.x - 1 - cam.x), Math.round(g.y) - 3);
                });
                mushrooms.forEach(m => ctx.drawImage(mush, Math.round(m.x - 1 - cam.x), Math.round(m.y) - 2));
                const cf = coinSeq[Math.floor(animT / 4) % 4];
                popCoins.forEach(c => ctx.drawImage(coinF[cf], Math.round(c.x - cam.x), Math.round(c.y)));
                particles.forEach(p => { ctx.drawImage(gShard, Math.round(p.x - cam.x), Math.round(p.y)); });
                fireworks.forEach(p => { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y), 2, 2); });
                floats.forEach(f => { ctx.globalAlpha = Math.min(1, f.life / 20); text(f.txt, Math.round(f.x - cam.x), Math.round(f.y)); ctx.globalAlpha = 1; });
            }
            function drawHUD() {
                text('MARIO', 8, 6); text(String(score).padStart(6, '0'), 8, 16);
                ctx.drawImage(hudCoin, 86, 15);
                text('x' + String(coins).padStart(2, '0'), 96, 16);
                text('WORLD', 140, 6); text('1-1', 144, 16);
                text('TIME', 200, 6);
                if (hurry) text(String(Math.max(timeLeft, 0)).padStart(3, '0'), 204, 16, frame % 30 < 15 ? '#ff5040' : '#fff');
                else text(String(Math.max(timeLeft, 0)).padStart(3, '0'), 204, 16);
            }
            function drawBoot() {
                ctx.fillStyle = '#0c1420'; ctx.fillRect(0, 0, VW, VH);
                textC('小霸王其乐无穷', 128, 96, '#fff', F16);
                textC('SUBOR  STUDENT  COMPUTER', 128, 130, '#8fa8c8');
                textC('· 像素游戏机 ·', 128, 148, '#5a7090', F10);
            }
            function drawTitle() {
                cam.x = 0;
                drawWorldBG(); drawTiles();
                ctx.drawImage(MAR.small.idle[1], 56, 192);
                const gx = 200 - ((animT * .4) % 260);
                ctx.drawImage(gW1, gx, 189);
                ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(50, 34, 158, 66);
                ctx.fillStyle = '#9c2810'; ctx.fillRect(46, 30, 158, 66);
                ctx.fillStyle = '#f8a45c'; ctx.fillRect(46, 30, 158, 2); ctx.fillRect(46, 94, 158, 2);
                ctx.fillRect(46, 30, 2, 66); ctx.fillRect(202, 30, 2, 66);
                textC('SUPER', 125, 42, '#ffd23e', '16px "Press Start 2P"');
                textC('MARIO', 125, 62, '#fff', '16px "Press Start 2P"');
                textC('小霸王 · 像素复刻版', 125, 82, '#ffc9a0', F10);
                textC('TOP-' + String(topScore).padStart(6, '0'), 128, 108, '#fff');
                if (frame % 60 < 38) textC('PRESS ENTER / START', 128, 134, '#fff');
                textC('←→ 移动   Z 跳跃   X 加速', 128, 158, '#dce8ff', F10);
                textC('踩扁敌人 顶出金币 吃蘑菇变大', 128, 174, '#dce8ff', F10);
                textC('© 2026 其乐无穷工作室', 128, 224, '#bcd8f8');
            }
            function drawInterlude() {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
                textC('WORLD  1-1', 128, 88);
                ctx.drawImage(MAR.small.idle[1], 104, 112);
                text('x  ' + lives, 124, 116);
            }
            function render() {
                ctx.setTransform(SC, 0, 0, SC, 0, 0);
                ctx.imageSmoothingEnabled = false;
                switch (state) {
                    case 'boot': drawBoot(); break;
                    case 'title': drawTitle(); break;
                    case 'interlude': drawInterlude(); break;
                    case 'gameover':
                        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
                        textC('GAME  OVER', 128, 100, '#fff', '12px "Press Start 2P"');
                        if (frame % 60 < 38) textC('PRESS ENTER', 128, 150, '#8fa8c8');
                        drawHUD(); break;
                    case 'bonus':
                        drawWorldBG(); drawTiles(); drawEntities(); drawHUD();
                        if (bonusDone) {
                            textC('COURSE  CLEAR !', 128, 86, '#ffd23e', '12px "Press Start 2P"');
                            if (clearT > 40 && frame % 60 < 38) textC('PRESS ENTER', 128, 120, '#fff');
                        }
                        break;
                    default:
                        drawWorldBG(); drawTiles(); drawEntities(); drawPlayer(); drawHUD();
                        if (paused) {
                            ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, VW, VH);
                            textC('PAUSE', 128, 112, '#fff', '12px "Press Start 2P"');
                        }
                }
            }

            /* ================= 启动 & 主循环 ================= */
            /* 关键修复：标题画面要以关卡为背景，必须先构建一次关卡数据 */
            buildLevel();

            let last = 0, acc = 0;
            function loop(t) {
                acc += Math.min(t - last, 100); last = t;
                while (acc >= 16.6667) { update(); acc -= 16.6667; }
                render();
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        })();
    </script>
