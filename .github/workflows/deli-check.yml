name: Deli E+ 自动打卡

on:
  # schedule:
  #   # 示例：中国时间工作日 08:20 签到
  #   - cron: '30 8 * * *'
  #     timezone: 'Asia/Shanghai'

  #   # 示例：中国时间工作日 20:00 签退
  #   - cron: '0 20 * * *'
  #     timezone: 'Asia/Shanghai'

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'dry'
        type: choice
        options:
          - dry
          - checkin
          - checkout
          - auto

permissions:
  contents: read

concurrency:
  group: deli-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DELI_MOBILE: ${{ secrets.DELI_MOBILE }}
      DELI_PASSWORD: ${{ secrets.DELI_PASSWORD }}
      DELI_TRUST_CODE: ${{ secrets.DELI_TRUST_CODE }}
      DELI_TERMINAL_ID: ${{ secrets.DELI_TERMINAL_ID }}
      DELI_ORG_ID: ${{ secrets.DELI_ORG_ID }}

      # 固定时间执行时建议设为 0
      DELI_RANDOM_DELAY: '0'

      # QQ 邮箱通知，可选
      SMTP_SSL: 'true'
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_SERVER: 'smtp.qq.com:465'
      SMTP_NAME: 'GitHub Actions 得力打卡'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Determine mode
        shell: bash
        run: |
          # 如果是手动触发，使用输入的模式
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DELI_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          # 如果是定时任务，判断当前时间是签到还是签退
          elif [[ "${{ github.event.schedule }}" == "30 8 * * *" ]]; then
            echo "DELI_MODE=checkin" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "0 20 * * *" ]]; then
            echo "DELI_MODE=checkout" >> "$GITHUB_ENV"
          fi

      - name: Run Deli E+ script
        run: |
          echo "运行模式: $DELI_MODE"
          python deli_eplus_auto_simple_v3.py